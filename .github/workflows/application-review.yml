name: Application preliminary review

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing application issue number to review
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: application-review-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  preliminary-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'type: poc-application') ||
      contains(github.event.issue.labels.*.name, 'type: incubation-application')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect deterministic evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/application_review.py \
            --repository "${GITHUB_REPOSITORY}" \
            --issue-number "${ISSUE_NUMBER}" \
            --output application-review.json

      - name: Synthesize advisory review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.6-terra' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REVIEW_REASONING_EFFORT || 'low' }}
        run: |
          python scripts/synthesize_application_review.py application-review.json \
            --output application-review.md \
            --assessment-output application-review-ai.json

      - name: Upsert review comment and route to human review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const report = JSON.parse(fs.readFileSync('application-review.json', 'utf8'));
            if (report.routing.skip) {
              core.info(`Skipping publication: ${report.routing.skip_reason}`);
              return;
            }

            const current = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const currentLabels = current.data.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );
            const terminal = new Set([
              'status: approved',
              'status: declined',
              'status: deferred',
              'status: paused',
              'status: archived',
              'status: graduated',
            ]);
            if (currentLabels.some(label => terminal.has(label))) {
              core.info('Skipping publication because the issue reached a terminal or paused state.');
              return;
            }

            const botLabel = 'bot: initial-review';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: botLabel,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: botLabel,
                color: 'EDEDED',
                description: 'Preliminary application review generated by automation',
              });
            }

            const targetStatus = report.routing.status_label;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [botLabel, targetStatus],
            });
            for (const label of ['status: needs-triage', 'status: needs-info', 'status: in-review']) {
              if (label === targetStatus || !currentLabels.includes(label)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                assignees: [report.routing.reviewer],
              });
            } catch (error) {
              core.warning(`Could not assign ${report.routing.reviewer}; the comment mention remains: ${error.message}`);
            }

            const marker = '<!-- osl-application-review-bot:v1 -->';
            const body = fs.readFileSync('application-review.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
